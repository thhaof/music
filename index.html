<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>thhaof - NhacCuaTui Style</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #121212;
            --bg-card: #1e1e1e;
            --bg-sidebar: #181818;
            --bg-hover: #282828;
            --accent-green: #1db954;
            --text-main: #ffffff;
            --text-sub: #b3b3b3;
            --border-color: #282828;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 240px;
            background-color: var(--bg-sidebar);
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-color);
            padding: 20px 0;
            user-select: none;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 20px 20px 20px;
            font-size: 24px;
            font-weight: bold;
            color: var(--text-main);
            border-bottom: 1px solid var(--border-color);
        }

        .logo i {
            color: var(--accent-green);
        }

        .nav-group {
            padding: 15px 0;
        }

        .nav-title {
            font-size: 11px;
            text-transform: uppercase;
            color: var(--text-sub);
            padding: 0 20px 10px 20px;
            letter-spacing: 1px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px 20px;
            color: var(--text-sub);
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
            font-weight: 600;
        }

        .nav-item:hover, .nav-item.active {
            color: var(--text-main);
            background-color: var(--bg-hover);
            border-left: 4px solid var(--accent-green);
        }

        /* Main Content */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding-bottom: 90px;
        }

        /* Header */
        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background-color: rgba(18, 18, 18, 0.9);
            position: sticky;
            top: 0;
            z-index: 10;
            backdrop-filter: blur(10px);
        }

        .search-bar {
            display: flex;
            align-items: center;
            background-color: var(--bg-card);
            padding: 8px 15px;
            border-radius: 20px;
            width: 350px;
            border: 1px solid var(--border-color);
        }

        .search-bar input {
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            margin-left: 10px;
            width: 100%;
        }

        .user-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .btn-auth {
            background-color: var(--accent-green);
            color: #000;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn-auth:hover {
            transform: scale(1.05);
        }

        /* Content Sections */
        .content {
            padding: 20px 30px;
        }

        .section-title {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Grid Layouts */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background-color: var(--bg-card);
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s;
            position: relative;
        }

        .card:hover {
            background-color: var(--bg-hover);
        }

        .card img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 10px;
        }

        .card-title {
            font-weight: bold;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-sub {
            font-size: 12px;
            color: var(--text-sub);
            margin-top: 4px;
        }

        /* Songs List */
        .song-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 30px;
        }

        .song-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 15px;
            background-color: var(--bg-card);
            border-radius: 6px;
            cursor: pointer;
        }

        .song-item:hover {
            background-color: var(--bg-hover);
        }

        .song-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .song-info img {
            width: 45px;
            height: 45px;
            border-radius: 4px;
            object-fit: cover;
        }

        /* Player Bar */
        .player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 80px;
            background-color: #000;
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 100;
        }

        .player-left {
            display: flex;
            align-items: center;
            gap: 15px;
            width: 25%;
        }

        .player-left img {
            width: 55px;
            height: 55px;
            border-radius: 4px;
        }

        .player-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 50%;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .controls i {
            color: var(--text-sub);
            cursor: pointer;
            font-size: 16px;
        }

        .controls i:hover {
            color: var(--text-main);
        }

        .controls i.btn-play {
            font-size: 32px;
            color: var(--text-main);
        }

        .progress-container {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            max-width: 500px;
            font-size: 12px;
            color: var(--text-sub);
        }

        .progress-bar {
            flex: 1;
            height: 4px;
            background-color: #404040;
            border-radius: 2px;
            cursor: pointer;
            position: relative;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background-color: var(--accent-green);
            border-radius: 2px;
        }

        .player-right {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 15px;
            width: 25%;
        }

        /* Modal Login */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: var(--bg-card);
            padding: 30px;
            border-radius: 8px;
            width: 320px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .modal-content input {
            padding: 10px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            background: #2a2a2a;
            color: white;
            outline: none;
        }

        .modal-content button {
            padding: 10px;
            background: var(--accent-green);
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        .error-msg {
            color: #ff4d4d;
            font-size: 12px;
            display: none;
        }
    </style>
</head>
<body>

    <!-- Sidebar Navigation -->
    <div class="sidebar">
        <div class="logo">
            <i class="fa-solid fa-music"></i> thhaof
        </div>
        
        <div class="nav-group">
            <div class="nav-title">Cửa Tui (My Music)</div>
            <div class="nav-item active" onclick="switchTab('mymusic')">
                <i class="fa-solid fa-house"></i> Trang chủ
            </div>
            <div class="nav-item" onclick="switchTab('favorites')">
                <i class="fa-solid fa-heart"></i> Yêu thích
            </div>
            <div class="nav-item" onclick="switchTab('recent')">
                <i class="fa-solid fa-clock-rotate-left"></i> Nghe gần đây
            </div>
            <div class="nav-item" onclick="createPlaylist()">
                <i class="fa-solid fa-square-plus"></i> Tạo playlist
            </div>
        </div>
    </div>

    <!-- Main Section -->
    <div class="main-container">
        <!-- Top Header -->
        <div class="top-header">
            <div class="search-bar">
                <i class="fa-solid fa-magnifying-glass" style="color: var(--text-sub);"></i>
                <input type="text" id="searchInput" placeholder="Tìm bài hát, ca sĩ..." oninput="searchSongs()">
            </div>
            <div class="user-actions">
                <button class="btn-auth" id="loginBtn" onclick="openLogin()">Đăng nhập</button>
            </div>
        </div>

        <!-- Main Content -->
        <div class="content" id="mainContent">
            <div class="section-title">Danh Sách Bài Hát</div>
            <div class="song-list" id="songList">
                <!-- Songs will render here -->
            </div>
        </div>
    </div>

    <!-- Bottom Audio Player -->
    <div class="player-bar">
        <div class="player-left">
            <img id="playerCover" src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=100&h=100&fit=crop" alt="Cover">
            <div>
                <div class="card-title" id="playerTitle">Chưa chọn bài hát</div>
                <div class="card-sub" id="playerArtist">--</div>
            </div>
        </div>

        <div class="player-center">
            <div class="controls">
                <i class="fa-solid fa-shuffle" onclick="toggleShuffle()"></i>
                <i class="fa-solid fa-backward-step" onclick="prevSong()"></i>
                <i class="fa-solid fa-circle-play btn-play" id="playBtn" onclick="togglePlay()"></i>
                <i class="fa-solid fa-forward-step" onclick="nextSong()"></i>
                <i class="fa-solid fa-repeat" onclick="toggleRepeat()"></i>
            </div>
            <div class="progress-container">
                <span id="currentTime">00:00</span>
                <div class="progress-bar" onclick="seekSong(event)">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <span id="totalTime">00:00</span>
            </div>
        </div>

        <div class="player-right">
            <i class="fa-solid fa-volume-high" style="color: var(--text-sub);"></i>
            <input type="range" min="0" max="1" step="0.1" value="1" onchange="setVolume(this.value)" style="width: 80px;">
        </div>
    </div>

    <!-- Login Modal -->
    <div class="modal" id="loginModal">
        <div class="modal-content">
            <h3 style="text-align: center;">Đăng nhập</h3>
            <input type="text" id="username" placeholder="Tên đăng nhập (admin)">
            <input type="password" id="password" placeholder="Mật khẩu (123456)">
            <div class="error-msg" id="errorMsg">Sai tài khoản hoặc mật khẩu!</div>
            <button onclick="login()">Xác nhận</button>
            <button onclick="closeLogin()" style="background: #404040; color: white;">Hủy</button>
        </div>
    </div>

    <audio id="audioPlayer"></audio>

    <script>
        // Songs Database
        const songs = [
            {
                id: 1,
                title: "Elegie",
                artist: "RPT MCK",
                cover: "https://pub-c53200e2456046529b88e014d8a71fcb.r2.dev/HVL%20by%20MCK/cover.jpg",
                src: "https://pub-c53200e2456046529b88e014d8a71fcb.r2.dev/HVL%20by%20MCK/01.%20Elegie.mp3"
            },
            {
                id: 2,
                title: "IDK",
                artist: "RPT MCK",
                cover: "https://pub-c53200e2456046529b88e014d8a71fcb.r2.dev/HVL%20by%20MCK/cover.jpg",
                src: "https://pub-c53200e2456046529b88e014d8a71fcb.r2.dev/HVL%20by%20MCK/02.%20IDK.mp3"
            }
        ];

        let currentIndex = 0;
        let isPlaying = false;
        let isLoggedIn = false;
        const audio = document.getElementById('audioPlayer');

        // Render Songs
        function renderSongs(list = songs) {
            const container = document.getElementById('songList');
            container.innerHTML = '';
            list.forEach((song, index) => {
                container.innerHTML += `
                    <div class="song-item" onclick="playSong(${index})">
                        <div class="song-info">
                            <img src="${song.cover}" alt="">
                            <div>
                                <div class="card-title">${song.title}</div>
                                <div class="card-sub">${song.artist}</div>
                            </div>
                        </div>
                        <i class="fa-solid fa-play" style="color: var(--text-sub);"></i>
                    </div>
                `;
            });
        }

        // Play Song
        function playSong(index) {
            currentIndex = index;
            const song = songs[currentIndex];
            audio.src = song.src;
            document.getElementById('playerCover').src = song.cover;
            document.getElementById('playerTitle').innerText = song.title;
            document.getElementById('playerArtist').innerText = song.artist;
            
            audio.play();
            isPlaying = true;
            document.getElementById('playBtn').className = "fa-solid fa-circle-pause btn-play";
        }

        function togglePlay() {
            if (!audio.src) return;
            if (isPlaying) {
                audio.pause();
                document.getElementById('playBtn').className = "fa-solid fa-circle-play btn-play";
            } else {
                audio.play();
                document.getElementById('playBtn').className = "fa-solid fa-circle-pause btn-play";
            }
            isPlaying = !isPlaying;
        }

        function nextSong() {
            currentIndex = (currentIndex + 1) % songs.length;
            playSong(currentIndex);
        }

        function prevSong() {
            currentIndex = (currentIndex - 1 + songs.length) % songs.length;
            playSong(currentIndex);
        }

        // Audio Events
        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                const pct = (audio.currentTime / audio.duration) * 100;
                document.getElementById('progressFill').style.width = pct + '%';
                document.getElementById('currentTime').innerText = formatTime(audio.currentTime);
                document.getElementById('totalTime').innerText = formatTime(audio.duration);
            }
        });

        audio.addEventListener('ended', nextSong);

        function formatTime(sec) {
            let m = Math.floor(sec / 60);
            let s = Math.floor(sec % 60);
            return `${m < 10 ? '0'+m : m}:${s < 10 ? '0'+s : s}`;
        }

        function seekSong(e) {
            const bar = e.currentTarget;
            const clickX = e.offsetX;
            const width = bar.clientWidth;
            audio.currentTime = (clickX / width) * audio.duration;
        }

        function setVolume(v) {
            audio.volume = v;
        }

        // Auth Modal Functions
        function openLogin() {
            document.getElementById('loginModal').style.display = 'flex';
        }

        function closeLogin() {
            document.getElementById('loginModal').style.display = 'none';
            document.getElementById('errorMsg').style.display = 'none';
        }

        function login() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;

            if (u === 'admin' && p === '123456') {
                isLoggedIn = true;
                document.getElementById('loginBtn').innerText = 'Đăng xuất';
                document.getElementById('loginBtn').onclick = logout;
                closeLogin();
                alert('Đăng nhập thành công!');
            } else {
                document.getElementById('errorMsg').style.display = 'block';
            }
        }

        function logout() {
            isLoggedIn = false;
            document.getElementById('loginBtn').innerText = 'Đăng nhập';
            document.getElementById('loginBtn').onclick = openLogin;
        }

        // Search
        function searchSongs() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const filtered = songs.filter(s => s.title.toLowerCase().includes(q) || s.artist.toLowerCase().includes(q));
            renderSongs(filtered);
        }

        function switchTab(tab) {
            const items = document.querySelectorAll('.nav-item');
            items.forEach(i => i.classList.remove('active'));
            event.currentTarget.classList.add('active');
        }

        function createPlaylist() {
            if (!isLoggedIn) {
                alert('Vui lòng đăng nhập để tạo playlist!');
                openLogin();
                return;
            }
            alert('Đã tạo playlist thành công!');
        }

        // Init
        renderSongs();
    </script>
</body>
</html>
