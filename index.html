<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music Player</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>
  <div class="player-container">
    <audio id="audio-player"></audio>

    <!-- Track Info -->
    <div class="track-info">
      <h2 id="title">Select a track</h2>
      <p id="artist">Artist</p>
    </div>

    <!-- Progress Bar -->
    <div id="progress-container" class="progress-container">
      <div id="progress-bar" class="progress-bar"></div>
    </div>
    <div class="time-stamps">
      <span id="current-time">0:00</span>
      <span id="duration">0:00</span>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button id="shuffle-btn" class="btn-control" title="Shuffle">
        <i class="fa-solid fa-shuffle"></i>
      </button>
      <button id="prev-btn" class="btn-control" title="Previous">
        <i class="fa-solid fa-backward-step"></i>
      </button>
      <button id="play-btn" class="btn-control play-btn" title="Play/Pause">
        <i id="play-icon" class="fa-solid fa-play"></i>
      </button>
      <button id="next-btn" class="btn-control" title="Next">
        <i class="fa-solid fa-forward-step"></i>
      </button>
      <button id="repeat-btn" class="btn-control" title="Repeat Mode: Off">
        <i id="repeat-icon" class="fa-solid fa-repeat"></i>
      </button>
    </div>

    <!-- Volume -->
    <div class="volume-container">
      <i id="volume-icon" class="fa-solid fa-volume-high volume-btn" title="Mute/Unmute"></i>
      <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="1" />
    </div>

    <!-- Playlist -->
    <div class="playlist-container">
      <ul id="playlist" class="playlist"></ul>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
