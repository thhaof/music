<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music Player</title>
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="user-badge">
        <i class="fa-solid fa-user-astronaut"></i>
        <span>WELCOME, USER</span>
      </div>

      <nav class="sidebar-section">
        <a href="#" class="nav-link"><i class="fa-solid fa-satellite-dish"></i> Database</a>
      </nav>

      <div class="card-box session-box">
        <div class="card-title"><i class="fa-solid fa-wave-square"></i> SESSION <span class="active-dot"></span></div>
        <div class="session-stat">
          <span>Tracks played</span>
          <span id="session-played">0</span>
        </div>
        <div class="session-stat">
          <span>Listening time</span>
          <span id="session-time">0 min</span>
        </div>
      </div>

      <div class="card-box collections-box">
        <div class="card-header">
          <span>COLLECTIONS</span>
          <i class="fa-solid fa-plus add-btn"></i>
        </div>

        <div class="sub-heading"><i class="fa-solid fa-star"></i> YOUR PLAYLISTS</div>
        <div class="playlist-menu">
          <div class="menu-item active"><i class="fa-solid fa-folder-closed"></i> All Tracks</div>
        </div>

        <div class="sub-heading"><i class="fa-solid fa-share-nodes"></i> SHARED PLAYLISTS</div>
        <div class="shared-menu">
          <div class="menu-item shared-item">
            <span><i class="fa-solid fa-headphones"></i> test</span>
            <span class="tag">ADMIN</span>
          </div>
          <div class="menu-item shared-item">
            <span><i class="fa-solid fa-headphones"></i> Brian</span>
            <span class="tag">BRIAN</span>
          </div>
          <div class="menu-item shared-item">
            <span><i class="fa-solid fa-headphones"></i> Jpop</span>
            <span class="tag">BRIAN</span>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="playlist-banner">
        <div class="banner-info">
          <span class="banner-subtitle">YOUR PLAYLIST</span>
          <h1 class="banner-title">Main Collection</h1>
          <p class="banner-meta"><span id="total-songs-count">0 songs</span> • <span id="total-artists-count">0 artists</span></p>
        </div>
        <div class="banner-controls">
          <button class="pill-btn primary" id="hero-play-btn"><i class="fa-solid fa-play"></i> Play</button>
          <button class="pill-btn secondary" id="hero-shuffle-btn"><i class="fa-solid fa-shuffle"></i> Shuffle</button>
          <button class="pill-btn secondary"><i class="fa-solid fa-pen"></i> Add/Edit Songs</button>
          <button class="pill-btn secondary"><i class="fa-solid fa-sort"></i> Sort Playlist</button>
        </div>
      </header>

      <section class="table-container">
        <table class="track-table">
          <thead>
            <tr>
              <th class="col-idx">#</th>
              <th class="col-cover"></th>
              <th class="col-title">TITLE</th>
              <th class="col-artist">ARTIST</th>
              <th class="col-time">DURATION</th>
            </tr>
          </thead>
          <tbody id="playlist">
            <!-- Rendered by JS -->
          </tbody>
        </table>
      </section>
    </main>

    <!-- Bottom Player Bar -->
    <footer class="player-bar">
      <div class="track-info">
        <div class="thumb-art" id="bottom-thumb">
          <i class="fa-solid fa-music"></i>
        </div>
        <div class="track-meta">
          <div id="title" class="track-name">Select a track</div>
          <div id="artist" class="track-artist">Artist</div>
        </div>
      </div>

      <div class="controls-center">
        <div class="playback-controls">
          <button id="shuffle-btn" class="icon-btn"><i class="fa-solid fa-shuffle"></i></button>
          <button id="prev-btn" class="icon-btn"><i class="fa-solid fa-backward-step"></i></button>
          <button id="play-btn" class="play-circle-btn"><i id="play-icon" class="fa-solid fa-play"></i></button>
          <button id="next-btn" class="icon-btn"><i class="fa-solid fa-forward-step"></i></button>
          <button id="repeat-btn" class="icon-btn"><i id="repeat-icon" class="fa-solid fa-rotate-right"></i></button>
        </div>

        <div class="progress-container">
          <span id="current-time" class="time-str">0:00</span>
          <div id="progress-bar-container" class="bar-wrapper">
            <div id="progress-bar" class="bar-fill"></div>
          </div>
          <span id="duration" class="time-str">0:00</span>
        </div>
      </div>

      <div class="volume-right">
        <i id="volume-icon" class="fa-solid fa-volume-high"></i>
        <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="1" />
        <span id="volume-val" class="volume-num">100%</span>
      </div>
    </footer>
  </div>

  <audio id="audio-player"></audio>
  <script src="app.js"></script>
</body>
</html>
