<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>thhaof - Web Player</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #121212; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #181818; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #555; }
    .glass-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); }
    .active-nav { background-color: rgba(255, 255, 255, 0.1); border-left: 4px solid #3b82f6; color: #fff !important; }
  </style>
</head>
<body class="h-screen flex flex-col overflow-hidden select-none">

  <!-- AUTH MODAL -->
  <div id="authModal" class="fixed inset-0 bg-black/80 z-50 flex items-center justify-center">
    <div class="bg-[#1e1e1e] p-8 rounded-2xl w-96 border border-gray-800 shadow-2xl relative">
      <h2 class="text-2xl font-bold mb-2 text-center text-blue-500">thhaof</h2>
      <p class="text-xs text-gray-400 text-center mb-6">Sign in to enjoy unlimited music streaming</p>
      
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="mb-4">
          <label class="block text-xs text-gray-400 mb-1">Username</label>
          <input type="text" id="usernameInput" class="w-full bg-[#2a2a2a] border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500" placeholder="Enter 'admin'" required>
        </div>
        <div class="mb-6">
          <label class="block text-xs text-gray-400 mb-1">Password</label>
          <input type="password" id="passwordInput" class="w-full bg-[#2a2a2a] border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500" placeholder="Enter '123456'" required>
        </div>
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2 rounded-lg text-sm transition">Login</button>
        <p id="loginError" class="text-red-500 text-xs mt-3 text-center hidden">Invalid username or password!</p>
      </form>
    </div>
  </div>

  <!-- CREATE PLAYLIST MODAL -->
  <div id="createPlaylistModal" class="fixed inset-0 bg-black/80 z-50 flex items-center justify-center hidden">
    <div class="bg-[#1e1e1e] p-6 rounded-xl w-96 border border-gray-800 shadow-2xl">
      <h3 class="text-lg font-bold mb-4">Create New Playlist</h3>
      <input type="text" id="playlistNameInput" class="w-full bg-[#2a2a2a] border border-gray-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500 mb-4" placeholder="My Playlist #1">
      <div class="flex justify-end gap-3">
        <button onclick="closeModal('createPlaylistModal')" class="px-4 py-2 bg-gray-700 hover:bg-gray-600 text-xs rounded-lg">Cancel</button>
        <button onclick="saveNewPlaylist()" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-xs rounded-lg font-semibold">Create</button>
      </div>
    </div>
  </div>

  <!-- ADD TO PLAYLIST MODAL -->
  <div id="addToPlaylistModal" class="fixed inset-0 bg-black/80 z-50 flex items-center justify-center hidden">
    <div class="bg-[#1e1e1e] p-6 rounded-xl w-96 border border-gray-800 shadow-2xl">
      <h3 class="text-lg font-bold mb-2">Add to Playlist</h3>
      <p id="targetSongTitle" class="text-xs text-gray-400 mb-4 truncate"></p>
      <div id="playlistSelectList" class="max-h-60 overflow-y-auto flex flex-col gap-2 mb-4">
        <!-- Playlists list will be loaded here -->
      </div>
      <div class="flex justify-end gap-3">
        <button onclick="closeModal('addToPlaylistModal')" class="px-4 py-2 bg-gray-700 hover:bg-gray-600 text-xs rounded-lg">Cancel</button>
      </div>
    </div>
  </div>

  <!-- MAIN WRAPPER -->
  <div class="flex flex-1 overflow-hidden">
    
    <!-- SIDEBAR -->
    <aside class="w-64 bg-[#181818] flex flex-col justify-between border-r border-gray-800/50">
      <div>
        <!-- Logo -->
        <div class="p-6 flex items-center gap-3">
          <div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center font-bold text-lg">T</div>
          <span class="font-bold text-xl tracking-wide bg-gradient-to-r from-blue-400 to-purple-500 bg-clip-text text-transparent">thhaof</span>
        </div>

        <!-- Navigation Menu -->
        <nav class="px-3 flex flex-col gap-1">
          <a href="#" onclick="switchView('discover')" id="nav-discover" class="nav-item active-nav flex items-center gap-4 px-4 py-3 text-sm text-gray-300 hover:text-white rounded-lg transition">
            <i class="fa-solid fa-compass text-lg"></i> Discover
          </a>
          <a href="#" onclick="switchView('for-you')" id="nav-for-you" class="nav-item flex items-center gap-4 px-4 py-3 text-sm text-gray-300 hover:text-white rounded-lg transition">
            <i class="fa-solid fa-sparkles text-lg"></i> For You
          </a>
          <a href="#" onclick="switchView('my-music')" id="nav-my-music" class="nav-item flex items-center gap-4 px-4 py-3 text-sm text-gray-300 hover:text-white rounded-lg transition">
            <i class="fa-solid fa-user-gear text-lg"></i> My Music
          </a>
        </nav>

        <hr class="border-gray-800 my-4 mx-4">

        <!-- Playlist Section -->
        <div class="px-6 flex items-center justify-between mb-3">
          <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Playlists</span>
          <button onclick="openModal('createPlaylistModal')" title="Create Playlist" class="text-gray-400 hover:text-white text-sm">
            <i class="fa-solid fa-plus"></i>
          </button>
        </div>

        <div id="sidebarPlaylists" class="px-3 flex flex-col gap-1 max-h-48 overflow-y-auto">
          <!-- Dynamic Playlists Added Here -->
        </div>
      </div>

      <!-- User Profile -->
      <div class="p-4 border-t border-gray-800/50 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-full bg-blue-600/30 text-blue-400 border border-blue-500/30 flex items-center justify-center text-sm font-bold" id="userAvatar">A</div>
          <div>
            <p class="text-xs font-semibold" id="userNameDisplay">Guest</p>
            <p class="text-[10px] text-gray-400" id="userStatus">Free Account</p>
          </div>
        </div>
        <button onclick="logout()" title="Logout" class="text-gray-400 hover:text-red-400 text-sm">
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>
      </div>
    </aside>

    <!-- CONTENT AREA -->
    <main class="flex-1 bg-gradient-to-b from-[#1e1e1e] to-[#121212] overflow-y-auto p-8">
      
      <!-- HEADER BAR -->
      <header class="flex items-center justify-between mb-8">
        <div class="flex items-center gap-4 w-1/3 bg-[#2a2a2a] px-4 py-2 rounded-full border border-gray-700/50">
          <i class="fa-solid fa-magnifying-glass text-gray-400 text-sm"></i>
          <input type="text" id="searchInput" onkeyup="filterSongs()" placeholder="Search songs, artists..." class="bg-transparent text-xs w-full text-white focus:outline-none">
        </div>
        <div class="flex items-center gap-3">
          <button onclick="openModal('createPlaylistModal')" class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded-full text-xs font-semibold flex items-center gap-2">
            <i class="fa-solid fa-plus"></i> Create Playlist
          </button>
        </div>
      </header>

      <!-- DYNAMIC CONTENT VIEWS -->
      <div id="contentView">
        
        <!-- DISCOVER VIEW -->
        <div id="discoverView">
          <h2 class="text-2xl font-bold mb-6">Discover Songs</h2>
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="songList">
            <!-- All Songs Cards -->
          </div>
        </div>

        <!-- PLAYLIST DETAIL VIEW (Hidden by default) -->
        <div id="playlistDetailView" class="hidden">
          <div class="flex items-end gap-6 mb-8">
            <div class="w-40 h-40 bg-gradient-to-tr from-blue-600 to-purple-600 rounded-2xl flex items-center justify-center shadow-xl">
              <i class="fa-solid fa-music text-5xl text-white/70"></i>
            </div>
            <div>
              <p class="text-xs uppercase font-semibold text-blue-400">Playlist</p>
              <h1 id="playlistDetailTitle" class="text-4xl font-bold mt-1 mb-3">My Playlist</h1>
              <p id="playlistDetailCount" class="text-xs text-gray-400 mb-4">0 Songs</p>
              <button id="playAllBtn" class="bg-blue-600 hover:bg-blue-500 px-6 py-2.5 rounded-full text-xs font-semibold flex items-center gap-2 shadow-lg">
                <i class="fa-solid fa-play"></i> Play All
              </button>
            </div>
          </div>

          <div class="bg-[#181818]/60 rounded-xl p-4">
            <div id="playlistSongsList" class="flex flex-col gap-2">
              <!-- Playlist Songs loaded here -->
            </div>
          </div>
        </div>

      </div>

    </main>
  </div>

  <!-- PLAYER FOOTER BAR -->
  <footer class="h-20 bg-[#181818] border-t border-gray-800/80 px-6 flex items-center justify-between z-40">
    <!-- Song Info -->
    <div class="flex items-center gap-4 w-1/4">
      <img id="currentCover" src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=100&h=100&fit=crop" class="w-12 h-12 rounded-lg object-cover">
      <div class="overflow-hidden">
        <h4 id="currentTitle" class="text-sm font-semibold truncate">Select a song</h4>
        <p id="currentArtist" class="text-xs text-gray-400 truncate">thhaof Player</p>
      </div>
      <button onclick="openAddToPlaylistCurrent()" title="Add to Playlist" class="text-gray-400 hover:text-white text-sm ml-2">
        <i class="fa-regular fa-plus-square"></i>
      </button>
    </div>

    <!-- Controls -->
    <div class="flex flex-col items-center gap-2 w-1/2 max-w-xl">
      <div class="flex items-center gap-6">
        <button id="shuffleBtn" onclick="toggleShuffle()" class="text-gray-400 hover:text-white text-xs"><i class="fa-solid fa-shuffle"></i></button>
        <button onclick="prevSong()" class="text-gray-300 hover:text-white text-sm"><i class="fa-solid fa-backward-step"></i></button>
        <button onclick="togglePlay()" class="w-9 h-9 rounded-full bg-white text-black flex items-center justify-center hover:scale-105 transition">
          <i id="playIcon" class="fa-solid fa-play text-sm ml-0.5"></i>
        </button>
        <button onclick="nextSong()" class="text-gray-300 hover:text-white text-sm"><i class="fa-solid fa-forward-step"></i></button>
        <button id="repeatBtn" onclick="toggleRepeat()" class="text-gray-400 hover:text-white text-xs"><i class="fa-solid fa-repeat"></i></button>
      </div>
      
      <!-- Progress Bar -->
      <div class="flex items-center gap-3 w-full">
        <span id="currentTime" class="text-[10px] text-gray-400 w-8 text-right">0:00</span>
        <input type="range" id="progressBar" value="0" min="0" max="100" onchange="seekAudio()" class="w-full h-1 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-blue-500">
        <span id="durationTime" class="text-[10px] text-gray-400 w-8">0:00</span>
      </div>
    </div>

    <!-- Volume -->
    <div class="flex items-center gap-3 w-1/4 justify-end">
      <i id="volumeIcon" class="fa-solid fa-volume-high text-gray-400 text-xs"></i>
      <input type="range" id="volumeBar" value="80" min="0" max="100" oninput="setVolume()" class="w-20 h-1 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-blue-500">
    </div>
  </footer>

  <!-- AUDIO ELEMENT -->
  <audio id="audioPlayer"></audio>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    // SONGS DATABASE (Cloudflare URL examples)
    const songs = [
            {
                id: "1",
                title: "Elegie",
                artist: "MCK",
                cover: "https://pub-c53200e2456046529b88e014d8a71fcb.r2.dev/HVL%20by%20MCK/cover.jpg",
                url: "https://pub-c53200e2456046529b88e014d8a71fcb.r2.dev/HVL%20by%20MCK/01.%20Elegie.mp3",
            },
           {
                id: "2",
                title: "IDK",
                artist: "MCK",
                cover: "https://pub-c53200e2456046529b88e014d8a71fcb.r2.dev/HVL%20by%20MCK/cover.jpg",
                url: "https://pub-c53200e2456046529b88e014d8a71fcb.r2.dev/HVL%20by%20MCK/02.%20IDK.mp3",
            },
            {
                id: "3",
                title: "Wtf Bby I'm Lit",
                artist: "MCK",
                cover: "https://pub-c53200e2456046529b88e014d8a71fcb.r2.dev/HVL%20by%20MCK/cover.jpg",
                url: "https://pub-c53200e2456046529b88e014d8a71fcb.r2.dev/HVL%20by%20MCK/03.%20Wtf%20Bby%20I_m%20Lit.mp3",
            },
    ];

    // PLAYLISTS STATE
    let playlists = [
      { id: 'p1', name: 'My Favorites', songIds: [1, 2] }
    ];

    let currentQueue = [...songs];
    let currentSongIndex = 0;
    let isPlaying = false;
    let selectedSongForPlaylist = null;

    const audio = document.getElementById('audioPlayer');

    // INITIALIZATION
    window.onload = () => {
      renderSongs(songs);
      renderSidebarPlaylists();
      loadSong(0);
    };

    // AUTHENTICATION
    function handleLogin(e) {
      e.preventDefault();
      const u = document.getElementById('usernameInput').value;
      const p = document.getElementById('passwordInput').value;
      
      if(u === 'admin' && p === '123456') {
        document.getElementById('authModal').classList.add('hidden');
        document.getElementById('userNameDisplay').innerText = u;
        document.getElementById('userStatus').innerText = 'VIP Member';
      } else {
        document.getElementById('loginError').classList.remove('hidden');
      }
    }

    function logout() {
      document.getElementById('authModal').classList.remove('hidden');
    }

    // MODAL CONTROL
    function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

    // RENDER SONGS
    function renderSongs(list) {
      const container = document.getElementById('songList');
      container.innerHTML = '';
      list.forEach((song) => {
        container.innerHTML += `
          <div class="glass-card p-4 rounded-xl flex items-center justify-between hover:bg-white/10 transition group">
            <div class="flex items-center gap-4 overflow-hidden">
              <img src="${song.cover}" class="w-12 h-12 rounded-lg object-cover">
              <div class="overflow-hidden">
                <h4 class="text-sm font-semibold truncate text-white">${song.title}</h4>
                <p class="text-xs text-gray-400 truncate">${song.artist}</p>
              </div>
            </div>
            <div class="flex items-center gap-2">
              <button onclick="openAddToPlaylistModal(${song.id})" title="Add to Playlist" class="text-gray-400 hover:text-blue-400 px-2 py-1">
                <i class="fa-solid fa-plus"></i>
              </button>
              <button onclick="playSongById(${song.id})" class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center opacity-0 group-hover:opacity-100 transition">
                <i class="fa-solid fa-play text-xs text-white"></i>
              </button>
            </div>
          </div>
        `;
      });
    }

    // PLAYLIST MANAGEMENT
    function saveNewPlaylist() {
      const name = document.getElementById('playlistNameInput').value.trim();
      if (!name) return;
      
      const newPlaylist = {
        id: 'p_' + Date.now(),
        name: name,
        songIds: []
      };
      
      playlists.push(newPlaylist);
      document.getElementById('playlistNameInput').value = '';
      closeModal('createPlaylistModal');
      renderSidebarPlaylists();
    }

    function renderSidebarPlaylists() {
      const container = document.getElementById('sidebarPlaylists');
      container.innerHTML = '';
      playlists.forEach(pl => {
        container.innerHTML += `
          <button onclick="openPlaylistView('${pl.id}')" class="w-full text-left px-4 py-2 text-xs text-gray-400 hover:text-white rounded-lg hover:bg-white/5 truncate flex items-center justify-between group">
            <span><i class="fa-solid fa-list-ul mr-2 text-blue-500"></i> ${pl.name}</span>
            <span class="text-[10px] text-gray-500">${pl.songIds.length}</span>
          </button>
        `;
      });
    }

    function openAddToPlaylistModal(songId) {
      selectedSongForPlaylist = songs.find(s => s.id === songId);
      document.getElementById('targetSongTitle').innerText = selectedSongForPlaylist.title;
      
      const listContainer = document.getElementById('playlistSelectList');
      listContainer.innerHTML = '';
      
      playlists.forEach(pl => {
        const isAdded = pl.songIds.includes(songId);
        listContainer.innerHTML += `
          <button onclick="toggleSongInPlaylist('${pl.id}', ${songId})" class="flex items-center justify-between p-3 rounded-lg bg-[#2a2a2a] hover:bg-[#333] text-xs transition">
            <span>${pl.name}</span>
            <i class="fa-solid ${isAdded ? 'fa-check text-green-400' : 'fa-plus text-gray-400'}"></i>
          </button>
        `;
      });
      openModal('addToPlaylistModal');
    }

    function openAddToPlaylistCurrent() {
      if (currentQueue[currentSongIndex]) {
        openAddToPlaylistModal(currentQueue[currentSongIndex].id);
      }
    }

    function toggleSongInPlaylist(playlistId, songId) {
      const pl = playlists.find(p => p.id === playlistId);
      if (pl) {
        if (pl.songIds.includes(songId)) {
          pl.songIds = pl.songIds.filter(id => id !== songId);
        } else {
          pl.songIds.push(songId);
        }
        openAddToPlaylistModal(songId);
        renderSidebarPlaylists();
      }
    }

    // PLAYLIST VIEW & PLAYBACK
    function openPlaylistView(playlistId) {
      const pl = playlists.find(p => p.id === playlistId);
      if (!pl) return;

      document.getElementById('discoverView').classList.add('hidden');
      document.getElementById('playlistDetailView').classList.remove('hidden');

      document.getElementById('playlistDetailTitle').innerText = pl.name;
      document.getElementById('playlistDetailCount').innerText = `${pl.songIds.length} Songs`;

      const plSongs = songs.filter(s => pl.songIds.includes(s.id));
      const songsListContainer = document.getElementById('playlistSongsList');
      songsListContainer.innerHTML = '';

      if (plSongs.length === 0) {
        songsListContainer.innerHTML = `<p class="text-xs text-gray-500 py-4 text-center">No songs in this playlist yet.</p>`;
      } else {
        plSongs.forEach((song, index) => {
          songsListContainer.innerHTML += `
            <div class="flex items-center justify-between p-3 hover:bg-white/10 rounded-lg transition group">
              <div class="flex items-center gap-4">
                <span class="text-xs text-gray-500 w-4">${index + 1}</span>
                <img src="${song.cover}" class="w-10 h-10 rounded-md object-cover">
                <div>
                  <h5 class="text-xs font-semibold text-white">${song.title}</h5>
                  <p class="text-[10px] text-gray-400">${song.artist}</p>
                </div>
              </div>
              <button onclick="playPlaylistSong('${playlistId}', ${song.id})" class="w-7 h-7 rounded-full bg-blue-600 flex items-center justify-center opacity-0 group-hover:opacity-100 transition">
                <i class="fa-solid fa-play text-[10px] text-white"></i>
              </button>
            </div>
          `;
        });
      }

      document.getElementById('playAllBtn').onclick = () => playPlaylist(playlistId);
    }

    function playPlaylist(playlistId) {
      const pl = playlists.find(p => p.id === playlistId);
      if (!pl || pl.songIds.length === 0) return;

      currentQueue = songs.filter(s => pl.songIds.includes(s.id));
      currentSongIndex = 0;
      loadSong(0);
      playAudio();
    }

    function playPlaylistSong(playlistId, songId) {
      const pl = playlists.find(p => p.id === playlistId);
      currentQueue = songs.filter(s => pl.songIds.includes(s.id));
      currentSongIndex = currentQueue.findIndex(s => s.id === songId);
      loadSong(currentSongIndex);
      playAudio();
    }

    // PLAYER CORE LOGIC
    function loadSong(index) {
      if (!currentQueue[index]) return;
      const song = currentQueue[index];
      audio.src = song.src;
      document.getElementById('currentCover').src = song.cover;
      document.getElementById('currentTitle').innerText = song.title;
      document.getElementById('currentArtist').innerText = song.artist;
    }

    function playSongById(id) {
      currentQueue = [...songs];
      currentSongIndex = currentQueue.findIndex(s => s.id === id);
      loadSong(currentSongIndex);
      playAudio();
    }

    function togglePlay() {
      if (isPlaying) pauseAudio();
      else playAudio();
    }

    function playAudio() {
      audio.play();
      isPlaying = true;
      document.getElementById('playIcon').className = "fa-solid fa-pause text-sm";
    }

    function pauseAudio() {
      audio.pause();
      isPlaying = false;
      document.getElementById('playIcon').className = "fa-solid fa-play text-sm ml-0.5";
    }

    function prevSong() {
      currentSongIndex = (currentSongIndex - 1 + currentQueue.length) % currentQueue.length;
      loadSong(currentSongIndex);
      playAudio();
    }

    function nextSong() {
      currentSongIndex = (currentSongIndex + 1) % currentQueue.length;
      loadSong(currentSongIndex);
      playAudio();
    }

    // AUDIO TIME & VOLUME UPDATES
    audio.ontimeupdate = () => {
      if (audio.duration) {
        const progress = (audio.currentTime / audio.duration) * 100;
        document.getElementById('progressBar').value = progress;
        document.getElementById('currentTime').innerText = formatTime(audio.currentTime);
        document.getElementById('durationTime').innerText = formatTime(audio.duration);
      }
    };

    audio.onended = () => nextSong();

    function seekAudio() {
      const seekTime = (document.getElementById('progressBar').value / 100) * audio.duration;
      audio.currentTime = seekTime;
    }

    function setVolume() {
      audio.volume = document.getElementById('volumeBar').value / 100;
    }

    function formatTime(seconds) {
      const min = Math.floor(seconds / 60);
      const sec = Math.floor(seconds % 60);
      return `${min}:${sec < 10 ? '0' : ''}${sec}`;
    }

    function switchView(view) {
      if (view === 'discover') {
        document.getElementById('playlistDetailView').classList.add('hidden');
        document.getElementById('discoverView').classList.remove('hidden');
      }
    }
  </script>
</body>
</html>
