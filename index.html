<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>thhaof Music Player</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>

  <!-- Login Screen -->
  <div id="login-screen" class="screen flex-center">
    <div class="login-card">
      <h2>thhaof Music Player</h2>
      <p class="subtitle">Please sign in to continue</p>
      <form id="login-form">
        <div class="input-group">
          <i class="fa-solid fa-user"></i>
          <input type="text" id="username" placeholder="Username" autocomplete="username" required />
        </div>
        <div class="input-group">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="password" placeholder="Password" autocomplete="current-password" required />
        </div>

        <p id="error-msg" class="error-text"></p>

        <button type="submit" id="login-btn" class="btn-primary">Sign In</button>
      </form>
      <p class="hint">Credentials: admin / 123456</p>
    </div>
  </div>

  <!-- Main App Interface -->
  <div id="app-screen" class="screen hidden">
    <!-- Header -->
    <header>
      <div class="brand">
        <i class="fa-solid fa-compact-disc logo-spin"></i>
        <span>thhaof Music Player</span>
      </div>
      <button id="logout-btn" class="btn-secondary" type="button">
        <i class="fa-solid fa-right-from-bracket"></i> Logout
      </button>
    </header>

    <!-- Main Container -->
    <main class="player-container">
      <!-- Player Card -->
      <div class="player-card">
        <div class="visualizer-display">
          <i class="fa-solid fa-music music-icon"></i>
        </div>
        
        <div class="track-info">
          <h1 id="title">No Track Selected</h1>
          <p id="artist">Unknown Artist</p>
        </div>

        <!-- Progress Bar -->
        <div class="progress-container" id="progress-container">
          <div class="progress-bar" id="progress-bar"></div>
        </div>
        <div class="time-stamps">
          <span id="current-time">0:00</span>
          <span id="duration">0:00</span>
        </div>

        <!-- Main Controls -->
        <div class="controls">
          <button id="shuffle-btn" class="control-btn" title="Shuffle" type="button">
            <i class="fa-solid fa-shuffle"></i>
          </button>
          <button id="prev-btn" class="control-btn" title="Previous Track" type="button">
            <i class="fa-solid fa-backward-step"></i>
          </button>
          <button id="play-btn" class="control-btn play-main" title="Play/Pause (Spacebar)" type="button">
            <i class="fa-solid fa-play" id="play-icon"></i>
          </button>
          <button id="next-btn" class="control-btn" title="Next Track" type="button">
            <i class="fa-solid fa-forward-step"></i>
          </button>
          <button id="repeat-btn" class="control-btn" title="Repeat" type="button">
            <i class="fa-solid fa-repeat"></i>
          </button>
        </div>

        <!-- Volume Control -->
        <div class="volume-container">
          <i class="fa-solid fa-volume-high" id="volume-icon"></i>
          <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.8" />
        </div>
      </div>

      <!-- Playlist Sidebar -->
      <div class="playlist-card">
        <div class="playlist-header">
          <h3><i class="fa-solid fa-list"></i> Playlist</h3>
        </div>
        <ul id="playlist" class="playlist-list"></ul>
      </div>
    </main>

    <audio id="audio-player"></audio>
  </div>

  <script src="app.js"></script>
</body>
</html>
