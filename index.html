<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>thhaof - Web Player</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  >

  <style>
    body {
      background-color: #121212;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #181818;
    }

    ::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #555;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
    }

    .active-nav {
      background-color: rgba(255, 255, 255, 0.1);
      border-left: 4px solid #3b82f6;
      color: #fff !important;
    }

    input[type="range"] {
      accent-color: #3b82f6;
    }
  </style>
</head>

<body class="h-screen flex flex-col overflow-hidden select-none">

  <!-- =========================================================
       AUTH MODAL
  ========================================================== -->

  <div
    id="authModal"
    class="fixed inset-0 bg-black/80 z-50 flex items-center justify-center"
  >
    <div
      class="bg-[#1e1e1e] p-8 rounded-2xl w-96 border border-gray-800 shadow-2xl"
    >
      <h2 class="text-2xl font-bold mb-2 text-center text-blue-500">
        thhaof
      </h2>

      <p class="text-xs text-gray-400 text-center mb-6">
        Sign in to enjoy unlimited music streaming
      </p>

      <form id="loginForm" onsubmit="handleLogin(event)">

        <!-- Username -->
        <div class="mb-4">
          <label class="block text-xs text-gray-400 mb-1">
            Username
          </label>

          <input
            type="text"
            id="usernameInput"
            class="w-full bg-[#2a2a2a] border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500"
            placeholder="Enter username"
            autocomplete="username"
            required
          >
        </div>

        <!-- Password -->
        <div class="mb-6">
          <label class="block text-xs text-gray-400 mb-1">
            Password
          </label>

          <input
            type="password"
            id="passwordInput"
            class="w-full bg-[#2a2a2a] border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500"
            placeholder="Enter password"
            autocomplete="current-password"
            required
          >
        </div>

        <button
          type="submit"
          class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2 rounded-lg text-sm transition"
        >
          Login
        </button>

        <p
          id="loginError"
          class="text-red-500 text-xs mt-3 text-center hidden"
        >
          Invalid username or password!
        </p>

      </form>
    </div>
  </div>


  <!-- =========================================================
       CREATE PLAYLIST MODAL
  ========================================================== -->

  <div
    id="createPlaylistModal"
    class="fixed inset-0 bg-black/80 z-50 flex items-center justify-center hidden"
  >
    <div
      class="bg-[#1e1e1e] p-6 rounded-xl w-96 border border-gray-800 shadow-2xl"
    >
      <h3 class="text-lg font-bold mb-4">
        Create New Playlist
      </h3>

      <input
        type="text"
        id="playlistNameInput"
        class="w-full bg-[#2a2a2a] border border-gray-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500 mb-4"
        placeholder="My Playlist #1"
      >

      <div class="flex justify-end gap-3">

        <button
          onclick="closeModal('createPlaylistModal')"
          class="px-4 py-2 bg-gray-700 hover:bg-gray-600 text-xs rounded-lg"
        >
          Cancel
        </button>

        <button
          onclick="saveNewPlaylist()"
          class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-xs rounded-lg font-semibold"
        >
          Create
        </button>

      </div>
    </div>
  </div>


  <!-- =========================================================
       ADD TO PLAYLIST MODAL
  ========================================================== -->

  <div
    id="addToPlaylistModal"
    class="fixed inset-0 bg-black/80 z-50 flex items-center justify-center hidden"
  >
    <div
      class="bg-[#1e1e1e] p-6 rounded-xl w-96 border border-gray-800 shadow-2xl"
    >

      <h3 class="text-lg font-bold mb-2">
        Add to Playlist
      </h3>

      <p
        id="targetSongTitle"
        class="text-xs text-blue-400 font-medium mb-4 truncate"
      ></p>

      <div
        id="playlistSelectList"
        class="max-h-60 overflow-y-auto flex flex-col gap-2 mb-4"
      >
      </div>

      <div class="flex justify-end gap-3">

        <button
          onclick="closeModal('addToPlaylistModal')"
          class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-xs rounded-lg font-semibold"
        >
          Done
        </button>

      </div>

    </div>
  </div>


  <!-- =========================================================
       MAIN WRAPPER
  ========================================================== -->

  <div class="flex flex-1 overflow-hidden">

    <!-- =======================================================
         SIDEBAR
    ======================================================== -->

    <aside
      class="w-64 bg-[#181818] flex flex-col justify-between border-r border-gray-800/50"
    >

      <div>

        <!-- Logo -->
        <div class="p-6 flex items-center gap-3">

          <div
            class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center font-bold text-lg"
          >
            T
          </div>

          <span
            class="font-bold text-xl tracking-wide bg-gradient-to-r from-blue-400 to-purple-500 bg-clip-text text-transparent"
          >
            thhaof
          </span>

        </div>


        <!-- Navigation -->
        <nav class="px-3 flex flex-col gap-1">

          <a
            href="#"
            onclick="switchView('discover'); return false;"
            id="nav-discover"
            class="nav-item active-nav flex items-center gap-4 px-4 py-3 text-sm text-gray-300 hover:text-white rounded-lg transition"
          >
            <i class="fa-solid fa-compass text-lg"></i>
            Discover
          </a>

        </nav>


        <hr class="border-gray-800 my-4 mx-4">


        <!-- Playlist Header -->
        <div class="px-6 flex items-center justify-between mb-3">

          <span
            class="text-xs font-semibold text-gray-400 uppercase tracking-wider"
          >
            Playlists
          </span>

          <button
            onclick="openModal('createPlaylistModal')"
            title="Create Playlist"
            class="text-gray-400 hover:text-white text-sm"
          >
            <i class="fa-solid fa-plus"></i>
          </button>

        </div>


        <!-- Playlists -->
        <div
          id="sidebarPlaylists"
          class="px-3 flex flex-col gap-1 max-h-56 overflow-y-auto"
        >
        </div>

      </div>


      <!-- User Profile -->
      <div
        class="p-4 border-t border-gray-800/50 flex items-center justify-between"
      >

        <div class="flex items-center gap-3">

          <div
            class="w-9 h-9 rounded-full bg-blue-600/30 text-blue-400 border border-blue-500/30 flex items-center justify-center text-sm font-bold"
            id="userAvatar"
          >
            T
          </div>

          <div>

            <p
              class="text-xs font-semibold"
              id="userNameDisplay"
            >
              Guest
            </p>

            <p
              class="text-[10px] text-gray-400"
              id="userStatus"
            >
              Free Account
            </p>

          </div>

        </div>


        <button
          onclick="logout()"
          title="Logout"
          class="text-gray-400 hover:text-red-400 text-sm"
        >
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>

      </div>

    </aside>


    <!-- =======================================================
         CONTENT AREA
    ======================================================== -->

    <main
      class="flex-1 bg-gradient-to-b from-[#1e1e1e] to-[#121212] overflow-y-auto p-8"
    >

      <!-- Header -->
      <header class="flex items-center justify-between mb-8">

        <div
          class="flex items-center gap-4 w-1/3 bg-[#2a2a2a] px-4 py-2 rounded-full border border-gray-700/50"
        >

          <i
            class="fa-solid fa-magnifying-glass text-gray-400 text-sm"
          ></i>

          <input
            type="text"
            id="searchInput"
            onkeyup="filterSongs()"
            placeholder="Search songs, artists..."
            class="bg-transparent text-xs w-full text-white focus:outline-none"
          >

        </div>


        <div class="flex items-center gap-3">

          <button
            onclick="openModal('createPlaylistModal')"
            class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded-full text-xs font-semibold flex items-center gap-2"
          >
            <i class="fa-solid fa-plus"></i>
            Create Playlist
          </button>

        </div>

      </header>


      <!-- Dynamic Views -->
      <div id="contentView">

        <!-- =====================================================
             DISCOVER VIEW
        ====================================================== -->

        <div id="discoverView">

          <h2 class="text-2xl font-bold mb-6">
            Discover Songs
          </h2>

          <div
            class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"
            id="songList"
          >
          </div>

        </div>


        <!-- =====================================================
             PLAYLIST DETAIL VIEW
        ====================================================== -->

        <div
          id="playlistDetailView"
          class="hidden"
        >

          <div class="flex items-end gap-6 mb-8">

            <div
              class="w-40 h-40 bg-gradient-to-tr from-blue-600 to-purple-600 rounded-2xl flex items-center justify-center shadow-xl"
            >
              <i
                class="fa-solid fa-music text-5xl text-white/70"
              ></i>
            </div>

            <div class="flex-1">

              <p
                class="text-xs uppercase font-semibold text-blue-400"
              >
                Playlist
              </p>

              <h1
                id="playlistDetailTitle"
                class="text-4xl font-bold mt-1 mb-3"
              >
                My Playlist
              </h1>

              <p
                id="playlistDetailCount"
                class="text-xs text-gray-400 mb-4"
              >
                0 Songs
              </p>

              <div class="flex items-center gap-3">

                <button
                  id="playAllBtn"
                  class="bg-blue-600 hover:bg-blue-500 px-6 py-2.5 rounded-full text-xs font-semibold flex items-center gap-2 shadow-lg"
                >
                  <i class="fa-solid fa-play"></i>
                  Play All
                </button>

                <button
                  id="deletePlaylistBtn"
                  class="bg-red-600/20 text-red-400 hover:bg-red-600/40 px-4 py-2.5 rounded-full text-xs font-semibold flex items-center gap-2 transition"
                >
                  <i class="fa-solid fa-trash"></i>
                  Delete
                </button>

              </div>

            </div>

          </div>


          <div
            class="bg-[#181818]/60 rounded-xl p-4"
          >

            <div
              id="playlistSongsList"
              class="flex flex-col gap-2"
            >
            </div>

          </div>

        </div>

      </div>

    </main>

  </div>


  <!-- =========================================================
       PLAYER FOOTER
  ========================================================== -->

  <footer
    class="h-20 bg-[#181818] border-t border-gray-800/80 px-6 flex items-center justify-between z-40"
  >

    <!-- Song Info -->
    <div class="flex items-center gap-4 w-1/4">

      <img
        id="currentCover"
        src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=100&h=100&fit=crop"
        class="w-12 h-12 rounded-lg object-cover"
        alt="Album cover"
      >

      <div class="overflow-hidden">

        <h4
          id="currentTitle"
          class="text-sm font-semibold truncate"
        >
          Select a song
        </h4>

        <p
          id="currentArtist"
          class="text-xs text-gray-400 truncate"
        >
          thhaof Player
        </p>

      </div>


      <button
        onclick="openAddToPlaylistCurrent()"
        title="Add to Playlist"
        class="text-gray-400 hover:text-white text-sm ml-2"
      >
        <i class="fa-solid fa-plus"></i>
      </button>

    </div>


    <!-- Controls -->
    <div
      class="flex flex-col items-center gap-2 w-1/2 max-w-xl"
    >

      <div class="flex items-center gap-6">

        <button
          onclick="prevSong()"
          class="text-gray-300 hover:text-white text-sm"
        >
          <i class="fa-solid fa-backward-step"></i>
        </button>


        <button
          onclick="togglePlay()"
          class="w-9 h-9 rounded-full bg-white text-black flex items-center justify-center hover:scale-105 transition"
        >
          <i
            id="playIcon"
            class="fa-solid fa-play text-sm ml-0.5"
          ></i>
        </button>


        <button
          onclick="nextSong()"
          class="text-gray-300 hover:text-white text-sm"
        >
          <i class="fa-solid fa-forward-step"></i>
        </button>

      </div>


      <!-- Progress -->
      <div class="flex items-center gap-3 w-full">

        <span
          id="currentTime"
          class="text-[10px] text-gray-400 w-8 text-right"
        >
          0:00
        </span>

        <input
          type="range"
          id="progressBar"
          value="0"
          min="0"
          max="100"
          step="0.1"
          oninput="seekAudio()"
          class="w-full h-1 bg-gray-700 rounded-lg appearance-none cursor-pointer"
        >

        <span
          id="durationTime"
          class="text-[10px] text-gray-400 w-8"
        >
          0:00
        </span>

      </div>

    </div>


    <!-- Volume -->
    <div
      class="flex items-center gap-3 w-1/4 justify-end"
    >

      <i
        id="volumeIcon"
        class="fa-solid fa-volume-high text-gray-400 text-xs"
      ></i>

      <input
        type="range"
        id="volumeBar"
        value="80"
        min="0"
        max="100"
        oninput="setVolume()"
        class="w-20 h-1 bg-gray-700 rounded-lg appearance-none cursor-pointer"
      >

    </div>

  </footer>


  <!-- AUDIO -->
  <audio id="audioPlayer" preload="metadata"></audio>

        src: "https://pub-c53200e2456046529b88e014d8a71fcb.r2.dev/HVL%20by%20MCK/19.%20D%C6%B0a%20Chua.mp3"
      },

      {
        id: 20,
        title: "Xa Xôi (feat. Obito)",
        artist: "MCK",
        cover: "https://pub-c53200e2456046529b88e014d8a71fcb.r2.dev/HVL%20by%20MCK/cover.jpg",
        src: "https://pub-c53200e2456046529b88e014d8a71fcb.r2.dev/HVL%20by%20MCK/20.%20Xa%20X%C3%B4i%20(feat.%20Obito).mp3"
      }

    ];


    /* =========================================================
       VARIABLES
    ========================================================== */

    let playlists = [];

    let currentQueue = [...songs];

    let currentSongIndex = 0;

    let isPlaying = false;

    let currentActivePlaylistId = null;

    const audio = document.getElementById('audioPlayer');


    /* =========================================================
       AUTH
    ========================================================== */

    function handleLogin(e) {

      e.preventDefault();

      const username =
        document.getElementById('usernameInput').value.trim();

      const password =
        document.getElementById('passwordInput').value;

      if (
        username === 'thhaof' &&
        password === '300172'
      ) {

        document
          .getElementById('authModal')
          .classList.add('hidden');

        document
          .getElementById('userNameDisplay')
          .innerText = username;

        document
          .getElementById('userStatus')
          .innerText = 'Member';

        document
          .getElementById('userAvatar')
          .innerText = username.charAt(0).toUpperCase();

        document
          .getElementById('loginError')
          .classList.add('hidden');

        document
          .getElementById('passwordInput')
          .value = '';

      } else {

        document
          .getElementById('loginError')
          .classList.remove('hidden');

      }
    }


    function logout() {

      audio.pause();

      audio.currentTime = 0;

      isPlaying = false;

      document
        .getElementById('playIcon')
        .className =
        "fa-solid fa-play text-sm ml-0.5";

      document
        .getElementById('authModal')
        .classList.remove('hidden');

      document
        .getElementById('usernameInput')
        .value = '';

      document
        .getElementById('passwordInput')
        .value = '';

      document
        .getElementById('loginError')
        .classList.add('hidden');

    }


    /* =========================================================
       LOCAL STORAGE PLAYLIST
    ========================================================== */

    function loadSavedPlaylists() {

      const saved =
        localStorage.getItem('thhaof_playlists');

      if (saved) {

        try {

          playlists = JSON.parse(saved);

          if (!Array.isArray(playlists)) {
            playlists = [];
          }

        } catch (error) {

          console.error(
            'Could not load playlists:',
            error
          );

          playlists = [];

        }

      } else {

        playlists = [
          {
            id: 'p1',
            name: 'My Favorites',
            songIds: [1, 2]
          }
        ];

        savePlaylists();

      }

    }


    function savePlaylists() {

      localStorage.setItem(
        'thhaof_playlists',
        JSON.stringify(playlists)
      );

    }


    /* =========================================================
       INITIALIZATION
    ========================================================== */

    window.onload = () => {

      loadSavedPlaylists();

      renderSongs(songs);

      renderSidebarPlaylists();

      audio.volume = 0.8;

      loadSong(0);

    };


    /* =========================================================
       MODALS
    ========================================================== */

    function openModal(id) {

      document
        .getElementById(id)
        .classList
        .remove('hidden');

    }


    function closeModal(id) {

      document
        .getElementById(id)
        .classList
        .add('hidden');

    }


    /* =========================================================
       RENDER SONGS
    ========================================================== */

    function renderSongs(list) {

      const container =
        document.getElementById('songList');

      container.innerHTML = '';

      if (list.length === 0) {

        container.innerHTML = `
          <div class="col-span-full text-center py-12 text-gray-500 text-sm">
            No songs found.
          </div>
        `;

        return;
      }


      list.forEach(song => {

        container.innerHTML += `

          <div
            class="glass-card p-4 rounded-xl flex items-center justify-between hover:bg-white/10 transition group"
          >

            <div
              class="flex items-center gap-4 overflow-hidden"
            >

              <img
                src="${song.cover}"
                class="w-12 h-12 rounded-lg object-cover"
                alt="${song.title}"
              >

              <div class="overflow-hidden">

                <h4
                  class="text-sm font-semibold truncate text-white"
                >
                  ${song.title}
                </h4>

                <p
                  class="text-xs text-gray-400 truncate"
                >
                  ${song.artist}
                </p>

              </div>

            </div>


            <div class="flex items-center gap-2">

              <button
                onclick="openAddToPlaylistModal(${song.id})"
                title="Add to Playlist"
                class="text-gray-400 hover:text-blue-400 px-2 py-1"
              >
                <i class="fa-solid fa-plus"></i>
              </button>


              <button
                onclick="playSongById(${song.id})"
                title="Play"
                class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center opacity-0 group-hover:opacity-100 transition"
              >
                <i class="fa-solid fa-play text-xs text-white"></i>
              </button>

            </div>

          </div>

        `;

      });

    }


    /* =========================================================
       CREATE PLAYLIST
    ========================================================== */

    function saveNewPlaylist() {

      const input =
        document.getElementById('playlistNameInput');

      const name = input.value.trim();

      if (!name) {
        return;
      }


      const newPlaylist = {

        id: 'p_' + Date.now(),

        name: name,

        songIds: []

      };


      playlists.push(newPlaylist);

      savePlaylists();

      input.value = '';

      closeModal('createPlaylistModal');

      renderSidebarPlaylists();

    }


    /* =========================================================
       SIDEBAR PLAYLISTS
    ========================================================== */

    function renderSidebarPlaylists() {

      const container =
        document.getElementById('sidebarPlaylists');

      container.innerHTML = '';


      if (playlists.length === 0) {

        container.innerHTML = `
          <p class="text-xs text-gray-600 px-4 py-2">
            No playlists yet.
          </p>
        `;

        return;

      }


      playlists.forEach(pl => {

        container.innerHTML += `

          <button
            onclick="openPlaylistView('${pl.id}')"
            class="w-full text-left px-4 py-2 text-xs text-gray-400 hover:text-white rounded-lg hover:bg-white/5 truncate flex items-center justify-between group"
          >

            <span class="truncate">

              <i
                class="fa-solid fa-list-ul mr-2 text-blue-500"
              ></i>

              ${pl.name}

            </span>


            <span
              class="text-[10px] bg-gray-800 px-2 py-0.5 rounded-full text-gray-400"
            >
              ${pl.songIds.length}
            </span>

          </button>

        `;

      });

    }


    /* =========================================================
       ADD TO PLAYLIST
    ========================================================== */

    function openAddToPlaylistModal(songId) {

      const targetSong =
        songs.find(song => song.id === songId);

      if (!targetSong) {
        return;
      }


      document
        .getElementById('targetSongTitle')
        .innerText = targetSong.title;


      renderPlaylistSelectList(songId);

      openModal('addToPlaylistModal');

    }


    function renderPlaylistSelectList(songId) {

      const listContainer =
        document.getElementById('playlistSelectList');

      listContainer.innerHTML = '';


      if (playlists.length === 0) {

        listContainer.innerHTML = `
          <p class="text-xs text-gray-500 text-center py-2">
            No playlists created yet.
          </p>
        `;

        return;

      }


      playlists.forEach(pl => {

        const isAdded =
          pl.songIds.includes(songId);


        listContainer.innerHTML += `

          <button
            onclick="toggleSongInPlaylist('${pl.id}', ${songId})"
            class="w-full flex items-center justify-between p-3 rounded-lg bg-[#2a2a2a] hover:bg-[#333] text-xs transition"
          >

            <span class="font-medium text-white">
              ${pl.name}
            </span>

            <i
              class="fa-solid ${
                isAdded
                  ? 'fa-check text-green-400'
                  : 'fa-plus text-gray-400'
              }"
            ></i>

          </button>

        `;

      });

    }


    function openAddToPlaylistCurrent() {

      if (currentQueue[currentSongIndex]) {

        openAddToPlaylistModal(
          currentQueue[currentSongIndex].id
        );

      }

    }


    function toggleSongInPlaylist(
      playlistId,
      songId
    ) {

      const playlist =
        playlists.find(
          p => p.id === playlistId
        );

      if (!playlist) {
        return;
      }


      if (playlist.songIds.includes(songId)) {

        playlist.songIds =
          playlist.songIds.filter(
            id => id !== songId
          );

      } else {

        playlist.songIds.push(songId);

      }


      savePlaylists();

      renderPlaylistSelectList(songId);

      renderSidebarPlaylists();


      if (
        currentActivePlaylistId === playlistId
      ) {

        openPlaylistView(playlistId);

      }

    }


    /* =========================================================
       OPEN PLAYLIST
    ========================================================== */

    function openPlaylistView(playlistId) {

      currentActivePlaylistId = playlistId;


      const playlist =
        playlists.find(
          p => p.id === playlistId
        );


      if (!playlist) {
        return;
      }


      document
        .getElementById('discoverView')
        .classList
        .add('hidden');


      document
        .getElementById('playlistDetailView')
        .classList
        .remove('hidden');


      document
        .getElementById('playlistDetailTitle')
        .innerText = playlist.name;


      document
        .getElementById('playlistDetailCount')
        .innerText =
        `${playlist.songIds.length} Songs`;


      const playlistSongs =
        songs.filter(
          song =>
            playlist.songIds.includes(song.id)
        );


      const container =
        document.getElementById(
          'playlistSongsList'
        );


      container.innerHTML = '';


      if (playlistSongs.length === 0) {

        container.innerHTML = `
          <p class="text-xs text-gray-500 py-6 text-center">
            No songs in this playlist yet.
            Go to Discover to add songs!
          </p>
        `;

      } else {

        playlistSongs.forEach(
          (song, index) => {

            container.innerHTML += `

              <div
                class="flex items-center justify-between p-3 hover:bg-white/10 rounded-lg transition group"
              >

                <div
                  class="flex items-center gap-4"
                >

                  <span
                    class="text-xs text-gray-500 w-4"
                  >
                    ${index + 1}
                  </span>

                  <img
                    src="${song.cover}"
                    class="w-10 h-10 rounded-md object-cover"
                    alt="${song.title}"
                  >

                  <div>

                    <h5
                      class="text-xs font-semibold text-white"
                    >
                      ${song.title}
                    </h5>

                    <p
                      class="text-[10px] text-gray-400"
                    >
                      ${song.artist}
                    </p>

                  </div>

                </div>


                <div
                  class="flex items-center gap-2"
                >

                  <button
                    onclick="toggleSongInPlaylist('${playlistId}', ${song.id})"
                    title="Remove from playlist"
                    class="text-gray-500 hover:text-red-400 text-xs px-2"
                  >
                    <i class="fa-solid fa-minus"></i>
                  </button>


                  <button
                    onclick="playPlaylistSong('${playlistId}', ${song.id})"
                    title="Play"
                    class="w-7 h-7 rounded-full bg-blue-600 flex items-center justify-center opacity-0 group-hover:opacity-100 transition"
                  >
                    <i class="fa-solid fa-play text-[10px] text-white"></i>
                  </button>

                </div>

              </div>

            `;

          }
        );

      }


      document
        .getElementById('playAllBtn')
        .onclick =
        () => playPlaylist(playlistId);


      document
        .getElementById('deletePlaylistBtn')
        .onclick =
        () => deletePlaylist(playlistId);

    }


    /* =========================================================
       DELETE PLAYLIST
    ========================================================== */

    function deletePlaylist(playlistId) {

      const confirmed =
        confirm(
          "Are you sure you want to delete this playlist?"
        );


      if (!confirmed) {
        return;
      }


      playlists =
        playlists.filter(
          p => p.id !== playlistId
        );


      savePlaylists();

      renderSidebarPlaylists();

      switchView('discover');

    }


    /* =========================================================
       PLAY PLAYLIST
    ========================================================== */

    function playPlaylist(playlistId) {

      const playlist =
        playlists.find(
          p => p.id === playlistId
        );


      if (
        !playlist ||
        playlist.songIds.length === 0
      ) {

        return;

      }


      currentQueue =
        songs.filter(
          song =>
            playlist.songIds.includes(song.id)
        );


      currentSongIndex = 0;

      loadSong(currentSongIndex);

      playAudio();

    }


    function playPlaylistSong(
      playlistId,
      songId
    ) {

      const playlist =
        playlists.find(
          p => p.id === playlistId
        );


      if (!playlist) {
        return;
      }


      currentQueue =
        songs.filter(
          song =>
            playlist.songIds.includes(song.id)
        );


      currentSongIndex =
        currentQueue.findIndex(
          song => song.id === songId
        );


      if (currentSongIndex === -1) {
        return;
      }


      loadSong(currentSongIndex);

      playAudio();

    }


    /* =========================================================
       AUDIO ENGINE
    ========================================================== */

    function loadSong(index) {

      if (!currentQueue[index]) {
        return;
      }


      const song =
        currentQueue[index];


      audio.src = song.src;

      audio.load();


      document
        .getElementById('currentCover')
        .src = song.cover;


      document
        .getElementById('currentTitle')
        .innerText = song.title;


      document
        .getElementById('currentArtist')
        .innerText = song.artist;


      document
        .getElementById('currentTime')
        .innerText = '0:00';


      document
        .getElementById('durationTime')
        .innerText = '0:00';


      document
        .getElementById('progressBar')
        .value = 0;

    }


    function playSongById(id) {

      currentQueue = [...songs];

      currentSongIndex =
        currentQueue.findIndex(
          song => song.id === id
        );


      if (currentSongIndex === -1) {
        return;
      }


      loadSong(currentSongIndex);

      playAudio();

    }


    function togglePlay() {

      if (isPlaying) {

        pauseAudio();

      } else {

        playAudio();

      }

    }


    async function playAudio() {

      try {

        await audio.play();

      } catch (error) {

        console.error(
          'Audio playback failed:',
          error
        );

      }

    }


    function pauseAudio() {

      audio.pause();

    }


    /* =========================================================
       PREVIOUS / NEXT
    ========================================================== */

    function prevSong() {

      if (currentQueue.length === 0) {
        return;
      }


      currentSongIndex =
        (
          currentSongIndex -
          1 +
          currentQueue.length
        ) %
        currentQueue.length;


      loadSong(currentSongIndex);

      playAudio();

    }


    function nextSong() {

      if (currentQueue.length === 0) {
        return;
      }


      currentSongIndex =
        (
          currentSongIndex +
          1
        ) %
        currentQueue.length;


      loadSong(currentSongIndex);

      playAudio();

    }


    /* =========================================================
       AUDIO EVENTS
    ========================================================== */

    audio.onplay = () => {

      isPlaying = true;

      document
        .getElementById('playIcon')
        .className =
        "fa-solid fa-pause text-sm";

    };


    audio.onpause = () => {

      isPlaying = false;

      document
        .getElementById('playIcon')
        .className =
        "fa-solid fa-play text-sm ml-0.5";

    };


    audio.ontimeupdate = () => {

      if (
        audio.duration &&
        !isNaN(audio.duration)
      ) {

        const progress =
          (
            audio.currentTime /
            audio.duration
          ) * 100;


        document
          .getElementById('progressBar')
          .value = progress;


        document
          .getElementById('currentTime')
          .innerText =
          formatTime(
            audio.currentTime
          );


        document
          .getElementById('durationTime')
          .innerText =
          formatTime(
            audio.duration
          );

      }

    };


    audio.onloadedmetadata = () => {

      document
        .getElementById('durationTime')
        .innerText =
        formatTime(audio.duration);

    };


    audio.onended = () => {

      nextSong();

    };


    audio.onerror = () => {

      console.error(
        'Could not load audio:',
        audio.src
      );

      isPlaying = false;

      document
        .getElementById('playIcon')
        .className =
        "fa-solid fa-play text-sm ml-0.5";

    };


    /* =========================================================
       SEEK
    ========================================================== */

    function seekAudio() {

      if (
        !audio.duration ||
        isNaN(audio.duration)
      ) {

        return;

      }


      const progress =
        document
          .getElementById('progressBar')
          .value;


      audio.currentTime =
        (
          progress / 100
        ) * audio.duration;

    }


    /* =========================================================
       VOLUME
    ========================================================== */

    function setVolume() {

      const value =
        document
          .getElementById('volumeBar')
          .value;


      audio.volume =
        value / 100;


      updateVolumeIcon(
        Number(value)
      );

    }


    function updateVolumeIcon(value) {

      const icon =
        document.getElementById(
          'volumeIcon'
        );


      if (value === 0) {

        icon.className =
          "fa-solid fa-volume-xmark text-gray-400 text-xs";

      } else if (value < 50) {

        icon.className =
          "fa-solid fa-volume-low text-gray-400 text-xs";

      } else {

        icon.className =
          "fa-solid fa-volume-high text-gray-400 text-xs";

      }

    }


    /* =========================================================
       FORMAT TIME
    ========================================================== */

    function formatTime(seconds) {

      if (
        !seconds ||
        isNaN(seconds)
      ) {

        return '0:00';

      }


      const minutes =
        Math.floor(
          seconds / 60
        );


      const secs =
        Math.floor(
          seconds % 60
        );


      return `${minutes}:${secs < 10 ? '0' : ''}${secs}`;

    }


    /* =========================================================
       SWITCH VIEW
    ========================================================== */

    function switchView(view) {

      if (view === 'discover') {

        currentActivePlaylistId = null;


        document
          .getElementById('playlistDetailView')
          .classList
          .add('hidden');


        document
          .getElementById('discoverView')
          .classList
          .remove('hidden');


        document
          .getElementById('nav-discover')
          .classList
          .add('active-nav');

      }

    }


    /* =========================================================
       SEARCH
    ========================================================== */

    function filterSongs() {

      const query =
        document
          .getElementById('searchInput')
          .value
          .toLowerCase()
          .trim();


      const filtered =
        songs.filter(song =>

          song.title
            .toLowerCase()
            .includes(query)

          ||

          song.artist
            .toLowerCase()
            .includes(query)

        );


      renderSongs(filtered);

    }


    /* =========================================================
       KEYBOARD SHORTCUTS
    ========================================================== */

    document.addEventListener(
      'keydown',
      event => {

        // Don't trigger shortcuts while typing
        const tag =
          document.activeElement.tagName;

        if (
          tag === 'INPUT' ||
          tag === 'TEXTAREA'
        ) {

          return;

        }


        // Space = Play / Pause
        if (event.code === 'Space') {

          event.preventDefault();

          togglePlay();

        }


        // Arrow Right = Next
        if (
          event.code === 'ArrowRight'
        ) {

          nextSong();

        }


        // Arrow Left = Previous
        if (
          event.code === 'ArrowLeft'
        ) {

          prevSong();

        }

      }
    );


  </script>

</body>
</html>
